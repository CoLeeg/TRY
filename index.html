<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>圖紙標註 + 批量PDF匯出 + Insta360 X5藍牙快門</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;}
#container{display:flex;gap:10px;}
#canvasWrap{border:1px solid #999;position:relative;}
#drawCanvas{position:absolute;top:0;left:0;}
#imgCanvas{position:absolute;top:0;left:0;}
.ctrl{margin-bottom:8px;}
.point{width:12px;height:12px;background:red;border-radius:50%;position:absolute;transform:translate(-50%,-50%);cursor:move;}
</style>
</head>
<body>
<div class="ctrl">
<input type="file" id="fileInput" multiple accept="image/*,.pdf">
<button onclick="exportAllPDF()">Export PDF</button>
<button onclick="openSizeDialog()">調整所有Point Size</button>
<button id="btBtn" onclick="connectInsta360()">Connect Insta360</button>
<span id="bt-status">藍牙：未連接</span>
</div>
<div id="container">
    <div id="canvasWrap">
        <canvas id="imgCanvas"></canvas>
        <canvas id="drawCanvas"></canvas>
    </div>
</div>

<script>
const { jsPDF } = window.jspdf;
let fileList = [];
let currentFileIndex = 0;
let pointsAll = []; // 每個圖紙對應的points: [{fileIndex, x,y,size}]
let defaultPointSize = 12;

let bluetoothDevice = null;
let btServer = null;
let btCaptureCharacteristic = null;
const INSTA_X5_SERVICE = '0000ffb0-0000-1000-8000-00805f9b34fb';
const CAPTURE_COMMAND = new Uint8Array([0x02, 0x01]);

const imgCanvas = document.getElementById('imgCanvas');
const drawCanvas = document.getElementById('drawCanvas');
const imgCtx = imgCanvas.getContext('2d');
const drawCtx = drawCanvas.getContext('2d');

// 讀取圖紙
document.getElementById('fileInput').addEventListener('change', async e=>{
    const files = Array.from(e.target.files);
    fileList = files;
    pointsAll = files.map(()=>[]);
    await loadFile(0);
})

async function loadFile(idx){
    currentFileIndex = idx;
    const file = fileList[idx];
    const url = URL.createObjectURL(file);
    const img = new Image();
    await new Promise(res=>{img.onload=res;img.src=url;})
    imgCanvas.width = img.width;
    imgCanvas.height = img.height;
    drawCanvas.width = img.width;
    drawCanvas.height = img.height;
    imgCtx.drawImage(img,0,0);
    redrawPoints();
}

// 點擊畫點
drawCanvas.onclick = async function(e){
    const rect = drawCanvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    pointsAll[currentFileIndex].push({x,y,size:defaultPointSize});
    redrawPoints();

    // 藍牙已連接才觸發拍照
    if(btCaptureCharacteristic){
        drawCanvas.style.cursor = "wait";
        await triggerInstaShot();
        drawCanvas.style.cursor = "";
    }
}

function redrawPoints(){
    drawCtx.clearRect(0,0,drawCanvas.width,drawCanvas.height);
    const pts = pointsAll[currentFileIndex];
    pts.forEach(p=>{
        drawCtx.fillStyle="red";
        drawCtx.beginPath();
        drawCtx.arc(p.x,p.y,p.size/2,0,Math.PI*2);
        drawCtx.fill();
    })
}

// 批量調整point大小
function openSizeDialog(){
    const newSize = prompt("輸入Point大小，預設："+defaultPointSize, defaultPointSize);
    if(newSize === null) return;
    const num = parseFloat(newSize);
    if(isNaN(num) || num<=0){alert("請輸入有效數字");return;}
    defaultPointSize = num;
    // 全部圖紙所有point更新size，位置不變
    pointsAll.forEach(pts=>{
        pts.forEach(p=>p.size = num);
    })
    redrawPoints();
}

// 批量匯出PDF，名稱 dd/mm/yyyy-layout record
async function exportAllPDF(){
    const today = new Date();
    const dd = String(today.getDate()).padStart(2,'0');
    const mm = String(today.getMonth()+1).padStart(2,'0');
    const yyyy = today.getFullYear();
    const fileName = `${dd}/${mm}/${yyyy}-layout record.pdf`.replace(/\//g,"-");

    const pdf = new jsPDF({
        orientation:'landscape',
        unit:'px'
    });
    pdf.deletePage(1);

    for(let i=0;i<fileList.length;i++){
        await loadFile(i);
        const canvas = document.createElement('canvas');
        canvas.width = imgCanvas.width;
        canvas.height = imgCanvas.height;
        const cctx = canvas.getContext('2d');
        cctx.drawImage(imgCanvas,0,0);
        cctx.drawImage(drawCanvas,0,0);
        const imgData = canvas.toDataURL('image/jpeg',0.95);

        if(i>0) pdf.addPage([canvas.width,canvas.height],"landscape");
        pdf.addImage(imgData, 'JPEG', 0,0, canvas.width, canvas.height);
    }
    pdf.save(fileName);
}

// ===== 藍牙 X5 連接函數（完整async）=====
async function connectInsta360(){
    if (!navigator.bluetooth) {
        alert("你的瀏覽器不支援 Web 藍牙功能，請使用 Chrome / Edge 桌面版");
        return;
    }
    try {
        document.getElementById('bt-status').textContent = "藍牙：掃描中...";
        const options = {
            filters: [ { namePrefix: "X5" } ],
            optionalServices: [INSTA_X5_SERVICE]
        };
        bluetoothDevice = await navigator.bluetooth.requestDevice(options);
        document.getElementById('bt-status').textContent = "藍牙：連線GATT中...";
        btServer = await bluetoothDevice.gatt.connect();
        await new Promise(resolve => setTimeout(resolve, 800));

        console.log('=== 連線成功！設備名稱：', bluetoothDevice.name, ' ===');
        const services = await btServer.getPrimaryServices();
        console.log('可用服務列表：');
        for (const service of services) {
            console.log('服務 UUID:', service.uuid);
            const characteristics = await service.getCharacteristics();
            console.log('  對應特徵 UUID：');
            characteristics.forEach(char => {
                console.log('   ', char.uuid, '| 屬性：', char.properties);
            });
        }
        const service = await btServer.getPrimaryService(INSTA_X5_SERVICE);
        btCaptureCharacteristic = await service.getCharacteristic('0000ffb2-0000-1000-8000-00805f9b34fb');

        document.getElementById('bt-status').textContent = `藍牙：已連接 ${bluetoothDevice.name}`;
        document.getElementById('btBtn').textContent = "Disconnect";
        document.getElementById('btBtn').classList.add('bt-connected');
        document.getElementById('btBtn').onclick = disconnectInsta360;
        bluetoothDevice.addEventListener('gattserverdisconnected', onBtDisconnected);
    } catch(error) {
        console.error('藍牙連線失敗：', error);
        let msg = "藍牙：連線失敗";
        if (error.name === 'NotFoundError') {
            if(error.message.includes("No Services")){
                msg = "藍牙：讀不到相機服務！請關閉手機Insta360 App、重啟相機";
            }else{
                msg = "藍牙：已取消掃描或未選取設備";
            }
        } else if (error.message.includes('not available')) {
            msg = "藍牙：請確認設備已開啟並處於可配對模式";
        }
        document.getElementById('bt-status').textContent = msg;
        setTimeout(() => {
            document.getElementById('bt-status').textContent = "藍牙：未連接";
        }, 3000);
    }
}

async function triggerInstaShot(){
    if (!btCaptureCharacteristic) return false;
    try {
        await btCaptureCharacteristic.writeValue(CAPTURE_COMMAND);
        await new Promise(resolve => setTimeout(resolve,1500));
        return true;
    } catch(e) {
        console.error("拍照指令錯誤",e);
        return false;
    }
}

function disconnectInsta360(){
    if(btServer) btServer.disconnect();
    onBtDisconnected();
}

function onBtDisconnected(){
    bluetoothDevice = null;
    btServer = null;
    btCaptureCharacteristic = null;
    document.getElementById('bt-status').textContent = "藍牙：已斷開";
    document.getElementById('btBtn').textContent = "Connect Insta360";
    document.getElementById('btBtn').classList.remove('bt-connected');
    document.getElementById('btBtn').onclick = connectInsta360;
}
</script>
</body>
</html>
